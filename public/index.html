<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>起势生图</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-copy">
            <h1>起势生图</h1>
          </div>
        </div>
        <div class="top-actions">
          <button id="settingsBtn" class="text-button hidden" type="button">配置</button>
          <button id="logoutBtn" class="text-button hidden" type="button">退出</button>
          <div class="status-pill" id="statusPill">检查中</div>
        </div>
      </header>

      <main class="layout" id="appLayout" aria-live="polite">
        <section class="panel composer-panel">
          <label class="prompt-field" for="prompt">
            <span class="field-label">提示词</span>
            <textarea
              id="prompt"
              rows="7"
              placeholder="描绘你想象中的图片"
            ></textarea>
          </label>

          <section class="preset-panel prompt-bank" aria-label="常用提示词">
            <div class="section-head">
              <span class="field-label">常用提示</span>
              <button id="addPresetBtn" class="text-button" type="button">添加</button>
            </div>
            <div id="presetList" class="preset-list"></div>
          </section>

          <section class="reference-panel" aria-label="参考图">
            <div class="section-head">
              <span class="field-label">参考图</span>
              <button id="clearBtn" class="text-button" type="button">清空</button>
            </div>

            <div class="reference-actions">
              <label class="soft-button upload-button">
                <input id="refs" type="file" accept="image/*" multiple />
                选择图片
              </label>
              <button id="pasteBtn" class="soft-button" type="button">粘贴图片</button>
            </div>

            <div
              id="pastePanel"
              class="paste-zone"
              tabindex="0"
              aria-label="粘贴参考图"
            >
              点击后按 Ctrl+V，或直接拖入图片
            </div>

            <div id="editSourceBanner" class="edit-banner hidden">
              <span>下一次会基于当前结果继续修改</span>
              <button id="cancelEditSourceBtn" class="text-button" type="button">取消</button>
            </div>

            <div id="refStrip" class="ref-strip" aria-live="polite"></div>
          </section>

          <section class="settings-grid" aria-label="生成设置">
            <div class="compact-field">
              <span class="field-label">尺寸</span>
              <div class="size-picker">
                <button
                  id="sizePickerButton"
                  class="picker-button"
                  type="button"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span class="picker-copy">
                    <strong id="sizePickerLabel">1024×1024</strong>
                    <small id="sizePickerHint">1:1</small>
                  </span>
                  <span class="picker-chevron" aria-hidden="true">⌄</span>
                </button>
                <div id="sizePickerMenu" class="picker-menu hidden" role="listbox"></div>
              </div>
            </div>

            <label class="compact-field">
              <span class="field-label">质量</span>
              <select id="quality">
                <option value="auto">自动</option>
                <option value="high">高</option>
                <option value="medium">中</option>
                <option value="low">低</option>
              </select>
            </label>

            <label class="compact-field">
              <span class="field-label">格式</span>
              <select id="format">
                <option value="png">PNG</option>
                <option value="webp">WEBP</option>
                <option value="jpeg">JPEG</option>
                <option value="svg">SVG</option>
              </select>
            </label>

            <div class="compact-field toggle-field">
              <span class="field-label">抠图</span>
              <button id="cutoutMode" class="mode-chip" type="button" aria-pressed="false">
                <span class="mode-chip-mark" aria-hidden="true"></span>
                <span>透明</span>
              </button>
            </div>
          </section>

          <input id="sizePreset" type="hidden" value="1024x1024" />
          <input id="model" type="hidden" value="gpt-image-2" />
          <input id="width" type="hidden" value="1024" />
          <input id="height" type="hidden" value="1024" />

          <button id="generateBtn" class="primary-button" type="button">
            <span id="generateBtnLabel" class="button-label">生成图片</span>
            <span class="button-loader" aria-hidden="true"></span>
          </button>
        </section>

        <section class="content-stack">
          <section class="panel preview-panel" id="previewPanel">
            <div class="section-head">
              <span class="section-title">结果</span>
            <div class="preview-actions">
              <button id="continueEditBtn" class="text-button hidden" type="button">继续修改</button>
              <button id="retouchBtn" class="text-button hidden" type="button">局部重绘</button>
              <button id="downloadBtn" class="text-button hidden" type="button">下载</button>
            </div>
            </div>

            <div id="emptyState" class="empty-state">
              <div class="empty-art" aria-hidden="true"></div>
              <p>生成结果会显示在这里</p>
            </div>

            <div id="loadingState" class="loading-state hidden">
              <div class="loading-orbit" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <p id="loadingText">正在组织画面</p>
            </div>

            <figure id="resultFigure" class="result-card hidden">
              <img id="resultImage" alt="生成结果" />
              <figcaption>
                <strong id="resultTitle">生成完成</strong>
                <p id="resultMeta"></p>
              </figcaption>
            </figure>

            <div id="errorBox" class="error-box hidden" role="alert"></div>
          </section>

          <section class="panel history-panel">
            <div class="section-head">
              <span class="section-title">历史</span>
              <div class="history-actions">
                <button id="toggleHistoryBtn" class="text-button" type="button">收起</button>
                <button id="exportHistoryBtn" class="text-button hidden" type="button">导出</button>
                <button id="importHistoryBtn" class="text-button" type="button">导入</button>
                <button id="clearHistoryBtn" class="text-button hidden" type="button">清空</button>
              </div>
            </div>

            <input id="historyImportInput" type="file" accept="application/json,.json" hidden />

            <div id="historyEmpty" class="history-empty">
              <p>这里会保存最近生成的结果和提示词。</p>
            </div>

            <div id="historyList" class="history-list"></div>
          </section>
        </section>
      </main>
    </div>

    <div id="retouchOverlay" class="retouch-overlay hidden" aria-hidden="true">
      <div class="retouch-card">
        <div class="section-head">
          <span class="section-title">局部重绘</span>
          <button id="retouchCloseBtn" class="text-button" type="button">关闭</button>
        </div>

        <div class="retouch-stage">
          <div class="retouch-canvas-stack">
            <canvas id="retouchCanvas"></canvas>
            <canvas id="retouchOverlayCanvas"></canvas>
          </div>
        </div>

        <label class="retouch-prompt-field" for="retouchPrompt">
          <span class="field-label">新的提示词</span>
          <textarea
            id="retouchPrompt"
            rows="3"
            placeholder="输入这次需要怎么改"
          ></textarea>
        </label>

        <div class="retouch-toolbar">
          <label class="retouch-slider">
            <span>画笔</span>
            <input id="retouchBrushRange" type="range" min="8" max="120" value="36" />
          </label>
          <button id="retouchClearBtn" class="soft-button" type="button">清空</button>
          <button id="retouchCancelBtn" class="soft-button" type="button">取消</button>
          <button id="retouchApplyBtn" class="primary-button" type="button">应用修改</button>
        </div>

        <p id="retouchError" class="retouch-error hidden" role="alert"></p>
      </div>
    </div>

    <div id="sessionOverlay" class="session-overlay hidden">
      <form id="sessionForm" class="session-card">
        <div class="session-head">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h2>配置生图网关</h2>
            <p>登录后 90 天内自动有效</p>
          </div>
        </div>

        <label class="session-field">
          <span>OPENAI_BASE_URL</span>
          <input
            id="baseUrlInput"
            type="url"
            autocomplete="url"
            placeholder="https://lave8.com/v1"
            required
          />
        </label>

        <label class="session-field">
          <span>OPENAI_API_KEY</span>
          <input
            id="apiKeyInput"
            type="password"
            autocomplete="current-password"
            placeholder="sk-..."
            required
          />
        </label>

        <button id="saveSessionBtn" class="primary-button" type="submit">进入起势生图</button>
        <p id="sessionError" class="session-error hidden"></p>
      </form>
    </div>

    <footer class="page-footer">
      <img class="footer-logo" src="/qishi-tech-logo.png" alt="起势科技" />
      <div class="footer-copy">
        <span>所有权归起势科技所有</span>
        <small>Qishi Technology</small>
      </div>
    </footer>
  </body>
</html>
