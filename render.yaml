services:
  - type: web
    name: qishi-image
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_BASE_URL
        value: https://lave8.com/v1
      - key: IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_API_KEY
        sync: false
